baseURL: https://mnnsolanki.github.io/
locale: en-us
title: Manthan's Log
theme: ["PaperMod"]

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentUseClasses: true

minify:
  disableXML: true
  minifyOutput: true

pagenation:
  disableAliases: false
  pagerSize: 3

menu:
  main:
    - name: About
      url: about
      weight: 1
    - name: Archive
      url: archives/
      weight: 2
    - name: Tags
      url: tags/
      weight: 3


params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Manthan's Log
  description: "I write about my journey into AI."
  keywords: ["AI", "Artificial Intelligence", "Machine Learning", "Deep Learning", "Manthan Solanki", "Manthan's Log"] 
  author: Me
  # images: ["/images/og-image.png"] # Path to your Open Graph image
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadcrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  UseHugoToc: true
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideAuthor: true
  hideSummary: false
  showtoc: true
  tocopen: false

  # profile-mode
  profileMode:
    enabled: false
    title: PaperMod
    imageUrl: "#"
    imageTitle: my image
    # imageWidth: 120
    # imageHeight: 120
    buttons:
      - name: Archives
        url: archives
      - name: Tags
        url: tags

  # home-info mode
  # homeInfoParams:
  #   Title: "Welcome to Manthan's Log \U0001F44B"
  #   Content: I write about my journey into AI.

  socialIcons:
    - name: x
      url: "https://x.com/mnnsolanki"
    - name: github
      url: "https://github.com/mnnsolanki"

  analytics:
    google:
      SiteVerifictionTag: ""

  cover:
      hidden: true # hide everywhere but not in structured data
      hiddenInList: true # hide on list pages and home
      hiddenInSingle: true # hide on single page

  # editPost:
  #     URL: "https://github.com/<path_to_repo>/content"
  #     Text: "Suggest Changes" # edit text
  #     appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
      isCaseSensitive: false
      shouldSort: true
      location: 0
      distance: 1000
      threshold: 0.4
      minMatchCharLength: 0
      limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
      keys: ["title", "permalink", "summary", "content"]

  assets:
    favicon: "favicon-v2.ico"
    favicon16x16: "favicon-16x16-v2.png"
    favicon32x32: "favicon-32x32-v2.png"
    apple_touch_icon: "apple-touch-icon-v2.png"
    safari_pinned_tab: "safari-pinned-tab.svg"

# label:
#   text: "Home"
#   icon: /apple-touch-icon.png
#   iconHeight: 35

# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai